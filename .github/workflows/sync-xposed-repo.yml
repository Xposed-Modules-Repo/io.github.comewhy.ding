
name: Sync Xposed Modules Repo

on:
  push:
    branches:
      - main
    tags:
      - '*'

  release:
    types:
      - published
      - edited

  workflow_dispatch:
    inputs:
      release_tag:
        description: '需要同步的历史 Release Tag，例如 1-1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Sync files and tags
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          TARGET_REPO: Xposed-Modules-Repo/io.github.comewhy.ding
        run: |
          set -euo pipefail

          if [ -z "$MIRROR_TOKEN" ]; then
            echo "Error: MIRROR_TOKEN is not configured."
            exit 1
          fi

          git remote add mirror \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/${TARGET_REPO}.git"

          git fetch origin --tags --force

          git push mirror HEAD:refs/heads/main --force

          git push mirror 'refs/tags/*:refs/tags/*' --force

  sync-release:
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'
    needs: sync-files
    runs-on: ubuntu-latest

    steps:
      - name: Download source release assets
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          gh auth status

          mkdir -p release-assets

          gh release view "$RELEASE_TAG" \
            --repo "$SOURCE_REPO"

          gh release download "$RELEASE_TAG" \
            --repo "$SOURCE_REPO" \
            --dir release-assets

      - name: Copy release to mirror
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          TARGET_REPO: Xposed-Modules-Repo/io.github.comewhy.ding
        run: |
          set -euo pipefail

          gh auth status

          TITLE=$(gh release view "$TAG" \
            --repo "$SOURCE_REPO" \
            --json name --jq '.name')

          BODY=$(gh release view "$TAG" \
            --repo "$SOURCE_REPO" \
            --json body --jq '.body')

          shopt -s nullglob
          ASSETS=(release-assets/*)

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "Error: No release assets found."
            exit 1
          fi

          if gh release view "$TAG" \
            --repo "$TARGET_REPO" >/dev/null 2>&1; then

            echo "Updating existing release: $TAG"

            gh release edit "$TAG" \
              --repo "$TARGET_REPO" \
              --title "$TITLE" \
              --notes "$BODY"

            gh release upload "$TAG" "${ASSETS[@]}" \
              --repo "$TARGET_REPO" \
              --clobber

          else

            echo "Creating new release: $TAG"

            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$TARGET_REPO" \
              --title "$TITLE" \
              --notes "$BODY" \
              --target main

          fi

          echo "Release synchronization completed: $TAG"
