
name: Telegram Release Notification

on:
  release:
    types: [published]

  # 支持手动重新推送历史版本
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要推送的 Release Tag，例如 1-1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  telegram:
    name: Send Release and APK to Telegram

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.release.prerelease == false

    runs-on: ubuntu-latest

    steps:
      # 1. 获取 Release 信息
      - name: Get release information
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi

          echo "Release tag: $TAG"

          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            > release.json

          if [ "$(jq -r '.draft' release.json)" = "true" ]; then
            echo "ERROR: Release is still a draft."
            exit 1
          fi

          if [ "$(jq -r '.prerelease' release.json)" = "true" ]; then
            echo "ERROR: Pre-release will not be sent."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "name=$(jq -r '.name // .tag_name' release.json)" \
            >> "$GITHUB_OUTPUT"

          jq -r '.body // "暂无更新说明"' \
            release.json > release_body.txt

      # 2. 下载所有 APK 附件
      - name: Download APK assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/assets"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' \
            --pattern '*.APK' \
            --dir "$GITHUB_WORKSPACE/assets"

          echo "Downloaded APK files:"

          find "$GITHUB_WORKSPACE/assets" \
            -maxdepth 1 -type f -iname '*.apk' -exec ls -lh {} \;

          COUNT=$(find "$GITHUB_WORKSPACE/assets" \
            -maxdepth 1 -type f -iname '*.apk' | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No APK files found."
            exit 1
          fi

      # 3. 发送版本说明
      - name: Send release information
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          BODY=$(cat release_body.txt)
          BODY="${BODY:0:3000}"

          MESSAGE=$(printf '🎉 Ding 发布新版本！\n\n📦 项目：Ding\n🏷 版本：%s\n🔖 Tag：%s\n\n📝 更新内容：\n%s\n\n📎 APK 安装包请查收。' \
            "$RELEASE_NAME" "$RELEASE_TAG" "$BODY")

          jq -n \
            --arg chat_id "$CHAT_ID" \
            --arg text "$MESSAGE" \
            '{
              chat_id: $chat_id,
              text: $text
            }' > message.json

          RESPONSE=$(curl --fail-with-body \
            --silent --show-error \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data-binary @message.json)

          echo "$RESPONSE" | jq .

          echo "$RESPONSE" | jq -e '.ok == true' > /dev/null

      # 4. 使用 Python 原生 HTTP 上传所有 APK
      - name: Send all APK files with Python
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          APK_DIRECTORY: ${{ github.workspace }}/assets
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import sys
          import json
          import uuid
          import mimetypes
          import urllib.request
          import urllib.error
          from pathlib import Path
          from urllib.parse import quote

          bot_token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]
          release_tag = os.environ["RELEASE_TAG"]
          apk_directory = Path(os.environ["APK_DIRECTORY"])

          MAX_SIZE = 50 * 1024 * 1024

          apk_files = sorted(
              p for p in apk_directory.iterdir()
              if p.is_file() and p.suffix.lower() == ".apk"
          )

          if not apk_files:
              print("ERROR: No APK files found.")
              sys.exit(1)

          print(f"Found {len(apk_files)} APK file(s).")

          for apk_path in apk_files:
              print("=" * 50)
              print(f"Preparing APK: {apk_path.name}")

              if not apk_path.is_file():
                  raise RuntimeError("APK file does not exist.")

              file_size = apk_path.stat().st_size

              print(f"Original file size: {file_size} bytes")

              if file_size <= 0:
                  raise RuntimeError("APK file is empty.")

              if file_size > MAX_SIZE:
                  raise RuntimeError(
                      f"APK exceeds 50MB: {apk_path.name}"
                  )

              # 使用 Python 二进制方式读取文件
              with apk_path.open("rb") as f:
                  file_data = f.read()

              actual_size = len(file_data)

              print(f"Python read size: {actual_size} bytes")

              if actual_size != file_size:
                  raise RuntimeError(
                      "File size mismatch. APK read was incomplete."
                  )

              print("APK read successfully.")

              boundary = "----ChatGPTTelegram" + uuid.uuid4().hex

              fields = {
                  "chat_id": chat_id,
                  "caption": f"Ding {release_tag} - {apk_path.name}"
              }

              body_parts = []

              for key, value in fields.items():
                  body_parts.append(
                      f"--{boundary}\r\n"
                      f'Content-Disposition: form-data; name="{key}"\r\n'
                      f"\r\n"
                      f"{value}\r\n"
                  .encode("utf-8"))

              safe_filename = apk_path.name.replace('"', '_')

              file_header = (
                  f"--{boundary}\r\n"
                  f'Content-Disposition: form-data; name="document"; '
                  f'filename="{safe_filename}"\r\n'
                  f"Content-Type: application/vnd.android.package-archive\r\n"
                  f"\r\n"
              ).encode("utf-8")

              body_parts.append(file_header)
              body_parts.append(file_data)
              body_parts.append(b"\r\n")
              body_parts.append(
                  f"--{boundary}--\r\n".encode("utf-8")
              )

              request_body = b"".join(body_parts)

              url = (
                  f"https://api.telegram.org/bot{bot_token}/sendDocument"
              )

              request = urllib.request.Request(
                  url,
                  data=request_body,
                  headers={
                      "Content-Type": f"multipart/form-data; boundary={boundary}",
                      "Content-Length": str(len(request_body)),
                  },
                  method="POST"
              )

              print(f"Uploading: {apk_path.name}")
              print(f"Request size: {len(request_body)} bytes")

              try:
                  with urllib.request.urlopen(
                      request, timeout=180
                  ) as response:
                      response_text = response.read().decode("utf-8")
                      http_status = response.status

              except urllib.error.HTTPError as error:
                  response_text = error.read().decode(
                      "utf-8", errors="replace"
                  )
                  http_status = error.code

              except urllib.error.URLError as error:
                  print(f"Network error: {error.reason}")
                  raise

              print(f"HTTP status: {http_status}")

              try:
                  result = json.loads(response_text)
              except json.JSONDecodeError:
                  print("ERROR: Invalid Telegram response.")
                  print(response_text[:2000])
                  sys.exit(1)

              print(json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ))

              if http_status != 200 or result.get("ok") is not True:
                  description = result.get(
                      "description", "Unknown Telegram API error"
                  )
                  raise RuntimeError(
                      f"Telegram upload failed: {description}"
                  )

              document = (
                  result.get("result", {}).get("document", {})
              )

              print(
                  "Telegram accepted APK: "
                  + document.get("file_name", apk_path.name)
              )

              print(f"Uploaded size: {document.get('file_size', 'unknown')}")

              print(f"SUCCESS: {apk_path.name}")

          print("=" * 50)
          print("All APK files sent successfully.")
          PY
